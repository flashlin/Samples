[project]
name = "caption-server"
version = "0.1.0"
description = "Local ASR, translation and SRT storage server for the caption Chrome extension"
readme = "README.md"
authors = [
    { name = "flash", email = "flash.lin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "fastapi>=0.165.0",
    "mlx-lm>=0.29.1",
    "numpy>=2.5.5",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "qwen-asr>=0.0.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
caption-server = "caption_server:main"
caption-server-setup = "caption_server.model_setup:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
