<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caption</title>
    <style>
      body { width: 320px; margin: 0; padding: 12px 14px; font: 13px/1.45 system-ui, -apple-system, "PingFang TC", sans-serif; color: #1f2328; background: #fff; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      #mode { font-weight: 600; }
      #detail { white-space: pre-line; color: #57606a; word-break: break-all; margin: 4px 0 10px; }
      #server { font-size: 12px; color: #57606a; margin-bottom: 10px; }
      button { display: block; width: 100%; margin: 6px 0 0; padding: 7px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; font: inherit; }
      button:hover { background: #eef1f4; }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      @media (prefers-color-scheme: dark) {
        body { background: #161b22; color: #e6edf3; }
        #detail, #server { color: #8b949e; }
        button { background: #21262d; border-color: #30363d; color: #e6edf3; }
        button:hover { background: #30363d; }
      }
    </style>
  </head>
  <body>
    <h1>Caption</h1>
    <div id="mode">Loading…</div>
    <div id="detail"></div>
    <div id="server">Checking server…</div>
    <button id="capture" class="primary" type="button">Capture tab audio</button>
    <button id="reset" type="button">Delete saved subtitles for this page</button>
    <button id="options" type="button">Options</button>
    <script src="popup.js" type="module"></script>
  </body>
</html>
