<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caption options</title>
    <style>
      body { max-width: 640px; margin: 24px auto; padding: 0 16px; font: 14px/1.5 system-ui, -apple-system, "PingFang TC", sans-serif; color: #1f2328; background: #fff; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input[type="text"], input[type="password"], input[type="number"], select, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
      textarea { min-height: 70px; }
      .check { font-weight: 400; display: flex; gap: 8px; align-items: center; }
      .hint { color: #57606a; font-size: 12px; font-weight: 400; }
      .actions { margin-top: 18px; display: flex; gap: 8px; }
      button { padding: 7px 14px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; font: inherit; }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      #status { white-space: pre-line; margin-top: 12px; color: #57606a; }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3; }
        input, select, textarea { background: #161b22; color: #e6edf3; border-color: #30363d; }
        button { background: #21262d; border-color: #30363d; color: #e6edf3; }
        .hint, #status { color: #8b949e; }
      }
    </style>
  </head>
  <body>
    <h1>Caption options</h1>
    <label for="endpoint">Caption server endpoint</label>
    <input id="endpoint" type="text" placeholder="http://127.0.0.1:8765" />
    <label for="token">Server token <span class="hint">(content of ~/.caption-server/token)</span></label>
    <input id="token" type="password" autocomplete="off" />
    <label for="site-mode">Sites</label>
    <select id="site-mode">
      <option value="all-except-denylist">All sites except the denylist</option>
      <option value="allowlist">Only sites in the allowlist</option>
    </select>
    <label for="denylist">Denylist <span class="hint">(one host per line, e.g. *.bank.com)</span></label>
    <textarea id="denylist"></textarea>
    <label for="allowlist">Allowlist <span class="hint">(used only in allowlist mode)</span></label>
    <textarea id="allowlist"></textarea>
    <label for="font-size">Caption font size (px)</label>
    <input id="font-size" type="number" min="10" max="64" />
    <label class="check"><input id="use-youtube-captions" type="checkbox" /> Use YouTube captions when a video has them</label>
    <label class="check"><input id="auto-start" type="checkbox" /> Start speech recognition automatically when media plays</label>
    <div class="actions">
      <button id="save" class="primary" type="button">Save</button>
      <button id="test" type="button">Test connection</button>
    </div>
    <div id="status"></div>
    <script src="options.js" type="module"></script>
  </body>
</html>
